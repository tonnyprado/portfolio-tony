<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marco Prado — Full-Stack Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
html { scroll-behavior: smooth; }
/* ============================================================
   Marco "Tony" Prado — Portfolio
   Clean sans · cream + yellow + black · smooth motion
   ============================================================ */

:root {
  --bg: #F4F1E9;
  --bg-2: #ECE8DD;
  --surface: #FFFFFF;
  --ink: #15140F;
  --ink-2: #56524A;
  --ink-3: #8C887D;
  --line: rgba(21, 20, 15, 0.12);
  --line-strong: rgba(21, 20, 15, 0.24);
  --accent: #E8B400;
  --accent-deep: #C2920A;
  --black: #141310;

  --font-display: "Space Grotesk", "Hanken Grotesk", sans-serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, monospace;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.1, 1);
  --maxw: 1320px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: var(--accent); color: var(--ink); }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img { display: block; max-width: 100%; }

.container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px); }

/* ---------- type ---------- */
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: "";
  width: 28px; height: 1px;
  background: var(--ink);
}
.eyebrow.no-rule::before { display: none; }

.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(40px, 7vw, 92px);
  line-height: 0.96;
  letter-spacing: -0.02em;
}

.mark { color: var(--accent-deep); }
.mark-block { background: var(--accent); padding: 0 0.12em; color: var(--ink); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  padding: 15px 26px;
  border-radius: 100px;
  transition: transform .4s var(--ease), background .3s, color .3s, box-shadow .3s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); }
.btn-dark { background: var(--black); color: #fff; }
.btn-dark:hover { box-shadow: 0 14px 34px -12px rgba(0,0,0,.5); }
.btn-yellow { background: var(--accent); color: var(--ink); }
.btn-yellow:hover { background: var(--accent-deep); }
.btn-ghost { border: 1.5px solid var(--ink); color: var(--ink); padding: 13.5px 24px; }
.btn-ghost:hover { background: var(--ink); color: #fff; }
.btn .arr { transition: transform .4s var(--ease); }
.btn:hover .arr { transform: translateX(4px); }

/* ============================================================
   NAVBAR
   ============================================================ */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 80;
  transition: background .4s, box-shadow .4s, padding .4s;
  padding: 22px 0;
}
.nav.scrolled {
  background: rgba(244, 241, 233, 0.82);
  backdrop-filter: blur(14px);
  box-shadow: 0 1px 0 var(--line);
  padding: 14px 0;
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
.logo .dot { color: var(--accent-deep); }
.nav-links { display: flex; align-items: center; gap: 30px; }
.nav-links a {
  font-size: 14.5px; font-weight: 500; color: var(--ink-2);
  position: relative; transition: color .3s;
}
.nav-links a::after {
  content: ""; position: absolute; left: 0; bottom: -5px; height: 2px; width: 0;
  background: var(--accent); transition: width .35s var(--ease);
}
.nav-links a:hover { color: var(--ink); }
.nav-links a:hover::after { width: 100%; }
.nav-right { display: flex; align-items: center; gap: 18px; }

.lang-toggle {
  display: flex; align-items: center; border: 1.5px solid var(--line-strong);
  border-radius: 100px; overflow: hidden; font-family: var(--font-mono); font-size: 12px;
}
.lang-toggle button { padding: 7px 12px; color: var(--ink-3); letter-spacing: .08em; transition: color .25s; }
.lang-toggle button.active { background: var(--ink); color: #fff; }

.nav-burger { display: none; flex-direction: column; gap: 5px; width: 30px; }
.nav-burger span { height: 2px; background: var(--ink); border-radius: 2px; transition: .3s; }

/* ============================================================
   HERO
   ============================================================ */
.hero { position: relative; padding-top: 132px; padding-bottom: 40px; overflow: hidden; }
.hero-grid {
  display: grid; grid-template-columns: 1.05fr 0.95fr; gap: clamp(24px, 5vw, 70px);
  align-items: center; min-height: calc(100vh - 220px);
}
.hero-hi { font-family: var(--font-mono); font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 18px; }
.hero-hi .wave { display: inline-block; }
.hero-title {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(52px, 9vw, 120px); line-height: 0.9; letter-spacing: -0.035em;
}
.hero-role-row { display: flex; align-items: center; gap: 18px; margin: 26px 0 22px; flex-wrap: wrap; }
.hero-role {
  font-family: var(--font-display); font-size: clamp(17px, 2.2vw, 24px); font-weight: 500;
  letter-spacing: -0.01em;
}
.hero-role-row .ln { flex: 0 0 46px; height: 1.5px; background: var(--ink); }
.hero-desc { font-size: clamp(16px, 1.6vw, 18.5px); color: var(--ink-2); max-width: 46ch; margin-bottom: 30px; }
.hero-checks { list-style: none; display: flex; flex-direction: column; gap: 11px; margin-bottom: 34px; }
.hero-checks li { display: flex; align-items: center; gap: 12px; font-size: 15.5px; font-weight: 500; }
.hero-checks .tick {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
  display: grid; place-items: center; flex: 0 0 auto;
}
.hero-checks .tick svg { width: 12px; height: 12px; }
.hero-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

/* hero visual */
.hero-visual { position: relative; align-self: stretch; display: flex; align-items: center; justify-content: center; }
.hero-photo-wrap {
  position: relative; width: min(100%, 440px); aspect-ratio: 1776 / 2487; max-height: 70vh;
}
.hero-blob {
  position: absolute; inset: -6% -8% -6% -8%;
  background: var(--accent);
  border-radius: 46% 54% 50% 50% / 58% 52% 48% 42%;
  z-index: 0;
}
.hero-photo {
  position: relative; z-index: 2; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 18%;
  border-radius: 220px 220px 28px 28px;
  box-shadow: 0 30px 70px -28px rgba(0,0,0,.45);
}
.hero-badge {
  position: absolute; z-index: 3; left: -6%; bottom: 12%;
  width: 116px; height: 116px; border-radius: 50%;
  background: var(--black); color: #fff;
  display: grid; place-items: center; text-align: center;
  font-family: var(--font-display); font-weight: 600; font-size: 14px; line-height: 1.2;
  box-shadow: 0 18px 40px -16px rgba(0,0,0,.5);
}
.hero-badge .yr { color: var(--accent); font-size: 26px; display: block; }
.hero-float {
  position: absolute; z-index: 3; font-family: var(--font-mono); font-size: 11px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 100px;
  padding: 8px 14px; box-shadow: 0 10px 26px -14px rgba(0,0,0,.4);
  display: flex; align-items: center; gap: 8px;
}
.hero-float .dotg { width: 8px; height: 8px; border-radius: 50%; background: #18a558; }
.hero-float.f1 { top: 6%; right: -4%; }
.hero-scrollcue {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3);
}
.hero-scrollcue .bar { width: 1.5px; height: 38px; background: var(--line-strong); position: relative; overflow: hidden; }
.hero-scrollcue .bar::after { content:""; position:absolute; top:0; left:0; width:100%; height:40%; background: var(--ink); animation: cue 1.8s var(--ease-soft) infinite; }
@keyframes cue { 0%{transform:translateY(-100%)} 100%{transform:translateY(250%)} }

/* ============================================================
   MARQUEE
   ============================================================ */
.marquee { background: var(--black); color: #fff; padding: 20px 0; overflow: hidden; white-space: nowrap; }
.marquee-track { display: inline-flex; gap: 0; animation: marq 32s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-item { font-family: var(--font-display); font-weight: 600; font-size: clamp(18px,2.4vw,30px); letter-spacing: 0.02em; padding: 0 30px; display: inline-flex; align-items: center; gap: 30px; }
.marquee-item .star { color: var(--accent); font-size: 0.7em; }
@keyframes marq { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ============================================================
   SECTION SHELL
   ============================================================ */
.section { padding: clamp(80px, 12vh, 150px) 0; position: relative; }
.section.alt { background: var(--bg-2); }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; flex-wrap: wrap; margin-bottom: 56px; }
.section-head .lead { max-width: 42ch; color: var(--ink-2); font-size: 16.5px; }

/* ============================================================
   ABOUT
   ============================================================ */
.about { position: relative; overflow: hidden; }
.about-bg {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  pointer-events: none; z-index: 0; opacity: 0.5;
}
.about-bg span {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(70px, 16vw, 250px);
  line-height: 0.82; letter-spacing: -0.03em; color: transparent;
  -webkit-text-stroke: 1.5px rgba(21,20,15,0.10); white-space: nowrap;
}
.about-bg span.fill { color: rgba(232,180,0,0.14); -webkit-text-stroke: 0; }
.about-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(30px,6vw,90px); align-items: center; }
.about-intro { font-family: var(--font-display); font-size: clamp(24px, 3.2vw, 40px); font-weight: 500; line-height: 1.18; letter-spacing: -0.02em; margin-bottom: 26px; }
.about-intro .hl { color: var(--accent-deep); }
.about-p { color: var(--ink-2); font-size: 17px; margin-bottom: 18px; max-width: 50ch; }
.about-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 20px; margin-top: 18px; }
.about-stat .n { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px,5vw,58px); line-height: 1; letter-spacing: -0.02em; }
.about-stat .n em { color: var(--accent-deep); font-style: normal; }
.about-stat .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--ink-2); margin-top: 8px; text-transform: uppercase; }

/* ============================================================
   PROJECTS — horizontal pinned
   ============================================================ */
.hproj { position: relative; background: var(--black); color: #fff; }
.hproj-intro { padding: clamp(70px,11vh,120px) 0 clamp(40px,6vh,70px); }
.hproj-intro .eyebrow { color: rgba(255,255,255,.6); }
.hproj-intro .eyebrow::before { background: var(--accent); }
.hproj-intro .section-title { color: #fff; }
.hproj-intro .lead { color: rgba(255,255,255,.6); }
.hproj-hint { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--accent); display:inline-flex; gap:10px; align-items:center; margin-top: 18px; }

.hproj-pin { position: relative; }
.hproj-sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; }
.hproj-track { display: flex; height: 100vh; will-change: transform; }
.hproj-panel {
  flex: 0 0 100vw; width: 100vw; height: 100vh;
  display: grid; grid-template-columns: 1.02fr 0.98fr; align-items: center;
  gap: clamp(28px,4vw,70px);
  padding: clamp(72px,9vh,110px) clamp(28px,6vw,90px) clamp(40px,6vh,70px);
}
.hproj-ghostnum {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-family: var(--font-display); font-weight: 700; font-size: 64vh; line-height: 1;
  color: rgba(255,255,255,0.035); z-index: 0; pointer-events: none; letter-spacing: -0.04em;
}
.hproj-media {
  position: relative; z-index: 1; aspect-ratio: 4/3; width: 100%;
  border-radius: 18px; overflow: hidden; cursor: pointer;
  transition: transform .55s var(--ease);
}
.hproj-media:hover { transform: translateY(-6px); }
.hproj-info { position: relative; z-index: 1; }
.hproj-idx { font-family: var(--font-mono); font-size: 13px; letter-spacing: .12em; color: var(--accent); margin-bottom: 16px; }
.hproj-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(38px,5.2vw,76px); line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 10px; }
.hproj-tagline { font-size: clamp(16px,1.7vw,20px); color: rgba(255,255,255,.7); margin-bottom: 22px; max-width: 42ch; }
.hproj-period { font-family: var(--font-mono); font-size: 12px; letter-spacing:.06em; color: rgba(255,255,255,.45); display:inline-flex; align-items:center; gap:8px; margin-bottom: 24px; }
.hproj-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
.tag {
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .04em;
  border: 1px solid rgba(255,255,255,.22); border-radius: 100px; padding: 6px 13px; color: rgba(255,255,255,.85);
}
.tag.solid { background: var(--accent); color: var(--ink); border-color: var(--accent); }

.hproj-progress { position: absolute; left: clamp(28px,6vw,90px); right: clamp(28px,6vw,90px); bottom: 34px; z-index: 3; display: flex; align-items: center; gap: 18px; }
.hproj-progress .count { font-family: var(--font-mono); font-size: 13px; color: rgba(255,255,255,.6); white-space: nowrap; }
.hproj-progress .count b { color: #fff; }
.hproj-bar { flex: 1; height: 2px; background: rgba(255,255,255,.16); position: relative; }
.hproj-bar i { position: absolute; left:0; top:0; height:100%; background: var(--accent); width: 0; }

/* media placeholder (image / video) */
.ph {
  position: absolute; inset: 0; background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 12px, rgba(255,255,255,0.02) 12px 24px);
  background-color: #1d1c18;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
}
.ph .ph-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: rgba(255,255,255,.55); padding: 0 20px; }
.ph .ph-play {
  width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--ink);
  display: grid; place-items: center; box-shadow: 0 14px 36px -10px rgba(232,180,0,.6);
}
.ph .ph-play svg { width: 24px; height: 24px; margin-left: 3px; }
.ph .ph-kind { font-family: var(--font-mono); font-size: 10.5px; letter-spacing:.2em; text-transform:uppercase; color: var(--accent); }
.ph.light { background-color: #e9e5da; background-image: repeating-linear-gradient(135deg, rgba(0,0,0,0.05) 0 12px, rgba(0,0,0,0.02) 12px 24px); }
.ph.light .ph-label { color: var(--ink-2); }

/* ============================================================
   EXPERIENCE
   ============================================================ */
.xp-list { display: flex; flex-direction: column; }
.xp-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: clamp(20px,4vw,60px);
  align-items: start; padding: 36px 0; border-top: 1px solid var(--line);
  transition: background .4s;
}
.xp-list .xp-row:last-child { border-bottom: 1px solid var(--line); }
.xp-logo {
  width: 60px; height: 60px; border-radius: 14px; background: var(--black); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px;
}
.xp-role { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px,2.6vw,30px); letter-spacing:-0.01em; }
.xp-co { font-size: 15px; color: var(--ink-2); margin-bottom: 16px; font-weight: 500; }
.xp-co .at { color: var(--accent-deep); }
.xp-desc { list-style: none; display: flex; flex-direction: column; gap: 9px; max-width: 70ch; }
.xp-desc li { position: relative; padding-left: 20px; color: var(--ink-2); font-size: 15px; }
.xp-desc li::before { content:""; position:absolute; left:0; top:9px; width:7px; height:7px; background: var(--accent); border-radius: 2px; }
.xp-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.xp-tags .t { font-family: var(--font-mono); font-size: 11px; border:1px solid var(--line-strong); border-radius:100px; padding:5px 11px; color: var(--ink-2); }
.xp-period { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; text-align: right; }

/* ============================================================
   SKILLS
   ============================================================ */
.skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.skill-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px; transition: transform .45s var(--ease), box-shadow .45s; }
.skill-card:hover { transform: translateY(-5px); box-shadow: 0 22px 50px -28px rgba(0,0,0,.35); }
.skill-card h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin-bottom: 18px; display:flex; align-items:center; gap:10px; }
.skill-card h3 .n { font-family: var(--font-mono); font-size: 12px; color: var(--accent-deep); }
.skill-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-mono); font-size: 12px; background: var(--bg-2); border-radius: 100px; padding: 7px 13px; color: var(--ink); }
.skill-card:hover .chip { background: var(--bg); }
.langs { margin-top: 40px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.langs .lab { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.langs .lang-badge { display:inline-flex; align-items:center; gap:9px; font-weight:600; font-size:15px; }
.langs .lang-badge .d { width:9px;height:9px;border-radius:50%;background:var(--accent); }

/* ============================================================
   EDUCATION timeline
   ============================================================ */
.edu-time { position: relative; max-width: 920px; margin: 0 auto; padding-left: 30px; }
.edu-time::before { content:""; position:absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.edu-item { position: relative; padding: 0 0 38px 40px; }
.edu-item:last-child { padding-bottom: 0; }
.edu-item::before { content:""; position:absolute; left: -29px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
.edu-period { font-family: var(--font-mono); font-size: 12px; color: var(--accent-deep); letter-spacing:.04em; }
.edu-item h3 { font-family: var(--font-display); font-size: clamp(19px,2.2vw,24px); font-weight: 600; margin: 6px 0 2px; letter-spacing:-0.01em; }
.edu-item h4 { font-size: 14.5px; color: var(--ink-2); font-weight: 500; margin-bottom: 10px; }
.edu-item p { color: var(--ink-2); font-size: 15px; max-width: 60ch; }
.certs { margin-top: 54px; }
.certs .lab { display:block; font-family: var(--font-mono); font-size: 12px; letter-spacing:.14em; text-transform:uppercase; color: var(--ink-2); margin-bottom: 16px; }
.cert-badge { display:inline-flex; flex-direction:column; gap:3px; background: var(--surface); border:1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; padding: 16px 22px; }
.cert-badge .cn { font-family: var(--font-display); font-weight:600; font-size:16px; }
.cert-badge .ci { font-size: 13px; color: var(--ink-2); }

/* ============================================================
   CONTACT
   ============================================================ */
.contact { background: var(--black); color: #fff; }
.contact-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: clamp(36px,6vw,90px); align-items: center; }
.contact h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px,7.5vw,104px); line-height: 0.92; letter-spacing: -0.03em; }
.contact h2 .y { color: var(--accent); }
.contact .lead { color: rgba(255,255,255,.65); font-size: 18px; max-width: 44ch; margin: 26px 0 36px; }
.contact-list { display: flex; flex-direction: column; gap: 4px; }
.contact-link {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 20px 0; border-top: 1px solid rgba(255,255,255,.14);
  font-family: var(--font-display); font-size: clamp(18px,2.4vw,26px); font-weight: 500;
  transition: padding .4s var(--ease), color .3s;
}
.contact-list .contact-link:last-child { border-bottom: 1px solid rgba(255,255,255,.14); }
.contact-link:hover { padding-left: 14px; color: var(--accent); }
.contact-link .k { font-family: var(--font-mono); font-size: 12px; letter-spacing:.1em; color: rgba(255,255,255,.45); text-transform: uppercase; }
.contact-link .v { display:flex; align-items:center; gap: 14px; }

/* ============================================================
   FOOTER
   ============================================================ */
.footer { background: var(--black); color: rgba(255,255,255,.55); padding: 40px 0; border-top: 1px solid rgba(255,255,255,.1); }
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 13.5px; }
.footer .logo { color: #fff; font-size: 18px; }
.footer-socials { display: flex; gap: 22px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; }
.footer-socials a:hover { color: var(--accent); }

/* ============================================================
   MODAL
   ============================================================ */
.modal-ov {
  position: fixed; inset: 0; z-index: 200; background: rgba(10,9,7,0.55);
  backdrop-filter: blur(8px); display: flex; align-items: flex-start; justify-content: center;
  padding: clamp(16px,5vh,60px) 18px; overflow-y: auto;
  opacity: 0; animation: ovin .35s var(--ease) forwards;
}
@keyframes ovin { to { opacity: 1; } }
.modal {
  position: relative; width: min(960px, 100%); background: var(--surface);
  border-radius: 22px; overflow: hidden; box-shadow: 0 40px 100px -30px rgba(0,0,0,.6);
  transform: translateY(24px) scale(.98); opacity: 0; animation: modin .5s .05s var(--ease) forwards;
}
@keyframes modin { to { transform: none; opacity: 1; } }
.modal-media { position: relative; aspect-ratio: 16/9; width: 100%; background: #1d1c18; }
.modal-close {
  position: absolute; top: 16px; right: 16px; z-index: 5; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(20,19,16,.7); color: #fff; display: grid; place-items: center; backdrop-filter: blur(6px);
  transition: background .25s, transform .3s var(--ease);
}
.modal-close:hover { background: var(--accent); color: var(--ink); transform: rotate(90deg); }
.modal-body { padding: clamp(26px,4vw,46px); }
.modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
.modal-kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; color: var(--accent-deep); text-transform: uppercase; }
.modal h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px,4.5vw,52px); line-height: .98; letter-spacing: -0.025em; margin: 8px 0 6px; }
.modal .modal-period { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); }
.modal-role { display:inline-flex; align-items:center; gap:8px; background: var(--accent); color: var(--ink); font-size: 13px; font-weight: 600; border-radius: 100px; padding: 8px 15px; white-space: nowrap; }
.modal-lead { font-size: 17.5px; color: var(--ink); margin: 22px 0 28px; max-width: 64ch; line-height: 1.55; }
.modal-section-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.modal-section-label::before { content:""; width: 18px; height: 1px; background: var(--ink); }
.modal-hl { list-style: none; display: grid; gap: 12px; margin-bottom: 30px; }
.modal-hl li { display: flex; gap: 13px; font-size: 15.5px; color: var(--ink); }
.modal-hl li .b { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--ink); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 700; margin-top: 1px; }
.modal-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
.modal-gallery .gph { position: relative; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; }
.modal-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
.modal-tags .tag { border-color: var(--line-strong); color: var(--ink-2); }
.modal-actions { display: flex; gap: 14px; flex-wrap: wrap; }

/* ============================================================
   REVEAL
   ============================================================ */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
.reveal.d1 { transition-delay: .08s; }
.reveal.d2 { transition-delay: .16s; }
.reveal.d3 { transition-delay: .24s; }
.reveal.d4 { transition-delay: .32s; }
.reveal-x { opacity: 0; transform: translateX(-40px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.reveal-x.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .reveal, .reveal-x { opacity: 1 !important; transform: none !important; }
  .marquee-track { animation: none; }
  .hproj-track { transition: none; }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 980px) {
  .nav-links { display: none; }
  .nav-burger { display: flex; }
  .hero-grid { grid-template-columns: 1fr; gap: 40px; min-height: 0; }
  .hero-visual { order: -1; }
  .hero-photo-wrap { width: min(78%, 360px); margin: 0 auto; }
  .about-inner { grid-template-columns: 1fr; }
  .skills-grid { grid-template-columns: 1fr 1fr; }
  .contact-grid { grid-template-columns: 1fr; }
  .hproj-pin { height: auto !important; }
  .hproj-sticky { position: static; height: auto; overflow: visible; }
  .hproj-track { flex-direction: column; height: auto; transform: none !important; }
  .hproj-panel { flex: 0 0 auto; width: 100%; height: auto; min-height: auto;
    grid-template-columns: 1fr; gap: 22px; align-content: center;
    padding: 56px clamp(20px,6vw,40px); }
  .hproj-media { aspect-ratio: 16/10; }
  .hproj-ghostnum { font-size: 30vh; }
  .hproj-progress { display: none; }
}
@media (max-width: 560px) {
  .skills-grid { grid-template-columns: 1fr; }
  .xp-row { grid-template-columns: 1fr; gap: 14px; }
  .xp-period { text-align: left; }
  .modal-gallery { grid-template-columns: 1fr; }
  .hero-badge { width: 92px; height: 92px; font-size: 11px; }
}

/* mobile menu */
.mobile-menu {
  position: fixed; inset: 0; z-index: 90; background: var(--bg);
  display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 40px;
  transform: translateY(-100%); transition: transform .5s var(--ease);
}
.mobile-menu.open { transform: none; }
.mobile-menu a { font-family: var(--font-display); font-weight: 600; font-size: 34px; padding: 8px 0; }
.mobile-menu a .mn { font-family: var(--font-mono); font-size: 13px; color: var(--accent-deep); margin-right: 12px; }
.mm-close { position: absolute; top: 24px; right: 24px; font-family: var(--font-mono); font-size: 14px; }

  </style>

function Projects({ lang, onOpen }) {
  const p = window.PORT.ui.projects;
  const list = window.PORT.projectList;
  const t = (o) => o[lang];
  const pinRef = useRef(null);
  const trackRef = useRef(null);
  const barRef = useRef(null);
  const countRef = useRef(null);

  useEffect(() => {
    const pin = pinRef.current, track = trackRef.current;
    if (!pin || !track) return;
    let cur = 0, target = 0, raf;
    const isMobile = () => window.innerWidth <= 980;

    const compute = () => {
      if (isMobile()) { target = 0; return; }
      const vh = window.innerHeight;
      const rect = pin.getBoundingClientRect();
      const travel = pin.offsetHeight - vh;
      const prog = travel > 0 ? Math.min(Math.max(-rect.top / travel, 0), 1) : 0;
      const maxX = track.scrollWidth - window.innerWidth;
      target = -prog * maxX;
      if (barRef.current) barRef.current.style.width = (prog * 100) + "%";
      if (countRef.current) countRef.current.textContent = String(Math.min(list.length, Math.round(prog * (list.length - 1)) + 1)).padStart(2, "0");
    };

    const tick = () => {
      cur += (target - cur) * 0.1;
      if (Math.abs(target - cur) < 0.1) cur = target;
      if (!isMobile()) track.style.transform = `translate3d(${cur}px,0,0)`;
      else track.style.transform = "";
      raf = requestAnimationFrame(tick);
    };

    compute();
    const onScroll = () => compute();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", compute);
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", compute);
    };
  }, [lang]);

  return (
    <section className="hproj" id="projects">
      <div className="hproj-intro container">
        <p className="eyebrow reveal">{t(p.eyebrow)}</p>
        <h2 className="section-title reveal d1" style={{ marginTop: 16 }}>
          {t(p.title)[0]}<br />{t(p.title)[1]}
        </h2>
        <p className="lead reveal d2" style={{ marginTop: 22, maxWidth: "46ch" }}>{t(p.lead)}</p>
        <p className="hproj-hint reveal d3">
          <span>→</span>{t(p.hint)}
        </p>
      </div>

      <div className="hproj-pin" ref={pinRef} style={{ height: `${list.length * 100}vh` }}>
        <div className="hproj-sticky">
          <div className="hproj-track" ref={trackRef}>
            {list.map((proj, i) => (
              <article className="hproj-panel" key={proj.id}>
                <span className="hproj-ghostnum" aria-hidden="true">{i + 1}</span>
                <div className="hproj-media" onClick={() => onOpen(proj)}>
                  <Placeholder project={proj} lang={lang} />
                </div>
                <div className="hproj-info">
                  <div className="hproj-idx">{String(i + 1).padStart(2, "0")} / {String(list.length).padStart(2, "0")}</div>
                  <h3 className="hproj-name">{proj.name}</h3>
                  <p className="hproj-tagline">{t(proj.tagline)}</p>
                  <div className="hproj-period"><span>◷</span>{t(proj.period)}</div>
                  <div className="hproj-tags">
                    <span className="tag solid">{t(proj.roleTag)}</span>
                    {proj.tech.slice(0, 4).map((tg) => <span className="tag" key={tg}>{tg}</span>)}
                  </div>
                  <button className="btn btn-yellow" onClick={() => onOpen(proj)}>
                    {t(p.open)}<span className="arr">→</span>
                  </button>
                </div>
              </article>
            ))}
          </div>
          <div className="hproj-progress">
            <span className="count"><b ref={countRef}>01</b> / {String(list.length).padStart(2, "0")}</span>
            <div className="hproj-bar"><i ref={barRef}></i></div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Hero({ lang }) {

function App() {
  const stored = (typeof localStorage !== "undefined" && localStorage.getItem("port_lang")) || "es";
  const [lang, setLangRaw] = useS(stored === "en" ? "en" : "es");
  const [active, setActive] = useS(null);
  const setLang = (l) => { setLangRaw(l); try { localStorage.setItem("port_lang", l); } catch (e) {} };

  useE(() => { document.documentElement.lang = lang; }, [lang]);

  // reveal observer — re-runs on language change (DOM remounts)
  useE(() => {
    const els = document.querySelectorAll(".reveal, .reveal-x");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) e.target.classList.add("in");
        else e.target.classList.remove("in");
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, [lang]);

  return (
    <>
      <Navbar lang={lang} setLang={setLang} />
      <Hero lang={lang} />
      <Marquee />
      <About lang={lang} />
      <Projects lang={lang} onOpen={setActive} />
      <Experience lang={lang} />
      <Skills lang={lang} />
      <Education lang={lang} />
      <Contact lang={lang} />
      <Footer lang={lang} />
      {active && <ProjectModal project={active} lang={lang} onClose={() => setActive(null)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
